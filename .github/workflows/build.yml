name: Build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Check out the code
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Build the plugin
        run: mvn -B package

      - name: Upload the jar
        uses: actions/upload-artifact@v4
        with:
          name: Ouushii
          path: target/Ouushii.jar
          if-no-files-found: error

      - name: Attach the jar to a release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: target/Ouushii.jar
